# Salin ke /etc/nginx/sites-available/koperasi lalu aktifkan:
#   sudo ln -s /etc/nginx/sites-available/koperasi /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Setelah domain mengarah ke VPS, pasang HTTPS:  sudo certbot --nginx -d koperasi.domainanda.com

server {
    listen 80;
    server_name koperasi.domainanda.com;   # ganti dengan domain / IP VPS aplikasi

    # Web (hasil build frontend)
    root /var/www/koperasife/frontend/dist;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API Node.js
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
